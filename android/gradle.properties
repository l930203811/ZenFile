# 本机内存仅 8GB：-Xmx6144M 过载导致 AGP 9 构建时 Gradle daemon 被系统杀进程（"daemon disappeared"）。
# 峰值内存紧张（R8/Kotlin 编译时可用物理内存可能 <4GB），降到 3G 并限制 Kotlin daemon 为 1.5G，
# 兼顾稳定性与构建速度（过大反而被 OOM 杀导致反复失败）。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512M -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536M
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
kotlin.incremental=false

org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configureondemand=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
